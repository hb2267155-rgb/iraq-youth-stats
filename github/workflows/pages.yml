
name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract website
        run: |
          mkdir extracted
          unzip -q iraq_youth_leagues_app_pwa-1.zip -d extracted
          INDEX=$(find extracted -name index.html -print -quit)
          if [ -z "$INDEX" ]; then
            echo "index.html not found"
            exit 1
          fi
          echo "SITE_DIR=$(dirname "$INDEX")" >> "$GITHUB_ENV"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
